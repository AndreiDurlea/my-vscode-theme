name: Release Extension

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve Version (CoreCatalog SemVer)
        id: version
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python scripts/resolve-version.py

      - name: Commit Auto-Bumped Version
        if: steps.version.outputs.should_release == 'true' && steps.version.outputs.auto_bumped == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json __CORECONTEXT_VERSION
          git commit -m "Bump version to ${{ steps.version.outputs.version }} [skip ci]"
          git push origin ${{ github.ref_name }}

      - name: Package VSIX
        if: steps.version.outputs.should_release == 'true'
        run: |
          npx -y @vscode/vsce package --no-git-tag-version

      - name: Publish GitHub Release
        if: steps.version.outputs.should_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" *.vsix --title "Deuterium $TAG" --notes "Release of Deuterium theme $TAG"
          else
            echo "Release $TAG already exists."
          fi

      - name: Publish to Open VSX Registry
        if: steps.version.outputs.should_release == 'true'
        env:
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
        run: |
          if [ -n "$OPEN_VSX_TOKEN" ]; then
            npx -y ovsx publish *.vsix -p "$OPEN_VSX_TOKEN"
          else
            echo "Skipping Open VSX publish: OPEN_VSX_TOKEN secret is not set."
          fi

      - name: Publish to VS Code Marketplace
        if: steps.version.outputs.should_release == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            npx -y @vscode/vsce publish -p "$VSCE_PAT"
          else
            echo "Skipping VS Code Marketplace publish: VSCE_PAT secret is not set."
          fi