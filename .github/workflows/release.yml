name: Release Extension

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup CoreCatalog Deploy Key
        if: env.CORECATALOG_DEPLOY_KEY != ''
        uses: webfactory/ssh-agent@v0.9.0
        env:
          CORECATALOG_DEPLOY_KEY: ${{ secrets.CORECATALOG_DEPLOY_KEY }}
        with:
          ssh-private-key: ${{ secrets.CORECATALOG_DEPLOY_KEY }}

      - name: Checkout CoreCatalog
        uses: actions/checkout@v4
        with:
          repository: 'AndreiDurlea/corecatalog'
          ssh-key: ${{ secrets.CORECATALOG_DEPLOY_KEY }}
          path: '.corecatalog'

      - name: CoreCatalog Unified Release
        id: release
        uses: ./.corecatalog/.github/actions/unified-release
        with:
          source: 'json'
          file: 'package.json'
          commit: 'true'
          package-command: |
            npm ci
            npm run build
            npx -y @vscode/vsce package --no-git-tag-version
          title: 'Deuterium'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Open VSX Registry
        if: steps.release.outputs.should_release == 'true' && env.OPEN_VSX_TOKEN != ''
        continue-on-error: true
        env:
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
          VSIX: ${{ steps.release.outputs.artifact }}
        run: |
          for i in 1 2 3; do
            echo "Publishing to Open VSX (attempt $i)..."
            if npx -y ovsx publish "$VSIX" -p "$OPEN_VSX_TOKEN"; then
              echo "Successfully published to Open VSX."
              break
            fi
            echo "Attempt $i failed. Retrying in 10s..."
            sleep 10
          done

      - name: Publish to VS Code Marketplace
        if: steps.release.outputs.should_release == 'true' && env.VSCE_PAT != ''
        continue-on-error: true
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSIX: ${{ steps.release.outputs.artifact }}
        run: |
          npx -y @vscode/vsce publish -p "$VSCE_PAT" --packagePath "$VSIX"